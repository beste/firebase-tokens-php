name: Tests

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/tests.yml'
      - 'composer.json'
      - '.phive/phars.xml'
      - 'phpstan.neon.dist'
      - 'phpunit.xml.dist'
      - '.php-cs-fixer.dist.php'
      - 'rector.php'
      - 'tools/**'
  push:
    branches: ['5.x']
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/tests.yml'
      - 'composer.json'
      - '.phive/phars.xml'
      - 'phpstan.neon.dist'
      - 'phpunit.xml.dist'
      - '.php-cs-fixer.dist.php'
      - 'rector.php'
      - 'tools/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  XDEBUG_MODE: 'off'

jobs:
  tests:
    name: "PHP ${{ matrix.php }}, ${{ matrix.dependencies }} deps"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        php:
          - "8.3"
          - "8.4"
          - "8.5"
          - "8.6"
        dependencies:
          - "lowest"
          - "highest"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          tools: composer, pecl
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer cache directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.json', 'composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        env:
          DEPENDENCIES: ${{ matrix.dependencies }}
        run: |
          if [ "$DEPENDENCIES" = "lowest" ]; then
            composer update --prefer-lowest --prefer-stable --no-interaction --no-progress --ansi
          else
            composer update --no-interaction --no-progress --ansi
          fi

      - name: Install PHPStan dependencies
        run: composer --working-dir=tools/.phpstan install --no-interaction --no-progress --ansi

      - name: Setup Problem Matchers
        run: |
          echo "::add-matcher::${MATCHER_PATH}/php.json"
          echo "::add-matcher::${MATCHER_PATH}/phpunit.json"
        env:
          MATCHER_PATH: ${{ runner.tool_cache }}

      - name: Run PHPStan
        run: tools/phpstan analyse --no-progress --error-format=github

      - name: Run unit tests
        run: tools/phpunit --exclude-group=emulator --testdox

      - name: Run emulator-mode tests
        env:
          FIREBASE_AUTH_EMULATOR_HOST: localhost:9099
        run: tools/phpunit --group=emulator --testdox

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          tools: composer
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer cache directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.json', 'composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --ansi

      - name: Install Rector dependencies
        run: composer --working-dir=tools/.rector install --no-interaction --no-progress --ansi

      - name: Run Rector
        run: tools/rector --dry-run --ansi --no-progress-bar

      - name: Run PHP-CS-Fixer
        run: tools/php-cs-fixer fix --dry-run --diff

  bc-check:
    name: Backward Compatibility Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          tools: composer
          coverage: none

      - name: Install Roave BC Check
        run: composer --working-dir=tools/.bc install --no-interaction --no-progress --ansi

      - name: Run Roave BC Check
        run: tools/.bc/vendor/bin/roave-backward-compatibility-check --format=github-actions
