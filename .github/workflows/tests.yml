name: Tests

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/tests.yml'
      - 'composer.json'
      - 'phpstan.neon.dist'
      - 'phpunit.xml.dist'
      - '.php-cs-fixer.dist.php'
      - 'rector.php'
      - 'tools/**'
  push:
    branches: ['5.x']
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/tests.yml'
      - 'composer.json'
      - 'phpstan.neon.dist'
      - 'phpunit.xml.dist'
      - '.php-cs-fixer.dist.php'
      - 'rector.php'
      - 'tools/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  XDEBUG_MODE: 'off'

jobs:
  tests:
    name: "PHP ${{ matrix.php }}, ${{ matrix.dependencies }} deps"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        php:
          - "8.3"
          - "8.4"
          - "8.5"
        dependencies:
          - "lowest"
          - "highest"
        include:
          - php: "8.6"
            dependencies: "highest"
            composer-options: "--ignore-platform-req=php+"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          tools: composer, pecl
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          composer-options: "${{ matrix.composer-options }}"
          dependency-versions: "${{ matrix.dependencies }}"

      - name: Setup Problem Matchers
        run: |
          echo "::add-matcher::${MATCHER_PATH}/php.json"
          echo "::add-matcher::${MATCHER_PATH}/phpunit.json"
        env:
          MATCHER_PATH: ${{ runner.tool_cache }}

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --error-format=github

      - name: Run unit tests
        run: vendor/bin/phpunit --exclude-group=emulator --testdox

      - name: Run emulator-mode tests
        env:
          FIREBASE_AUTH_EMULATOR_HOST: localhost:9099
        run: vendor/bin/phpunit --group=emulator --testdox

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          tools: composer
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: highest

      - name: Run Rector
        run: vendor/bin/rector --dry-run

      - name: Run PHP-CS-Fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

  bc-check:
    name: Backward Compatibility Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          tools: composer
          coverage: none

      - name: Install Roave BC Check
        run: composer tools:bc:install

      - name: Run Roave BC Check
        run: tools/.bc/vendor/bin/roave-backward-compatibility-check --format=github-actions
